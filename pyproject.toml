[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "1.0.0"
description = "LLM-Powered Windows Automation Framework"
requires-python = ">=3.11"
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.5.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "pyperclip>=1.8.2",
    "openai>=1.12.0",
    "jinja2>=3.1.2",
    "tenacity>=8.2.3",
    "PyQt6>=6.6.0",
    "PyQt6-Qt6>=6.6.0",
    "pywin32>=306",
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["cortex"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1.0",
]

[project.scripts]
cortex = "cortex.main:main"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
